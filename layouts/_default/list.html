{{ define "main" }}
<div class="list-page">
    <h1>{{ .Title }}</h1>
    <div class="post-list">
        {{ range .Pages }}
        <div class="post-item">
            <a href="{{ .RelPermalink }}" class="post-title">{{ .Title }}</a>
            <span class="post-meta">{{ .Date.Format "Jan 2, 2006" }} | {{ .ReadingTime }} min read</span>
            {{ with .Params.subtitle }}
            <p class="post-subtitle">{{ . }}</p>
            {{ end }}
            <p class="post-excerpt">{{ with .Params.description }}{{ . }}{{ else }}{{ .Summary }}{{ end }}</p>
        </div>
        {{ end }}
    </div>
</div>
{{ end }}
