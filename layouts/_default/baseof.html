<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{{ block "title" . }}{{ .Site.Title }}{{ end }}</title>
        {{ with .Params.subtitle }}
        <meta name="subtitle" content="{{ . }}" />
        {{ end }}
        <meta
            name="description"
            content="{{ with .Params.subtitle }}{{ . }}{{ with $.Params.description }} || {{ . }}{{ end }}{{ else }}{{ with .Params.description }}{{ . }}{{ else }}{{ .Summary }}{{ end }}{{ end }}"
        />

        <!-- Open Graph / Social Preview -->
        <meta
            property="og:title"
            content="{{ with .Title }}{{ . }} | {{ end }}{{ .Site.Title }}"
        />
        <meta
            property="og:description"
            content="{{ with .Params.subtitle }}{{ . }}{{ with $.Params.description }} || {{ . }}{{ end }}{{ else }}{{ with .Params.description }}{{ . }}{{ else }}{{ .Summary }}{{ end }}{{ end }}"
        />
        <meta property="og:type" content="article" />
        <meta property="og:url" content="{{ .Permalink }}" />

        {{ partial "extend_head.html" . }}
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,700;1,400;1,700&family=Raleway:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&display=swap"
            rel="stylesheet"
        />
        <script>
            (function() {
                var saved = localStorage.getItem('theme');
                var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
            })();
        </script>
        <link rel="stylesheet" href="/css/style.css" />
        <link rel="stylesheet" href="/css/syntax-light.css" />
        <link rel="stylesheet" href="/css/syntax-dark.css" />
        <script src="/js/footnotes.js" defer></script>
        <script src="/js/lightbox.js" defer></script>
        <script defer>
            document.addEventListener('DOMContentLoaded', function() {
                var toggle = document.getElementById('theme-toggle');
                if (!toggle) return;
                toggle.addEventListener('click', function() {
                    var current = document.documentElement.getAttribute('data-theme');
                    var next = current === 'dark' ? 'light' : 'dark';
                    document.documentElement.setAttribute('data-theme', next);
                    localStorage.setItem('theme', next);
                });
            });
        </script>
    </head>
    <body>
        {{ partial "header.html" . }}
        <main class="main-content">{{ block "main" . }}{{ end }}</main>
        {{ partial "footer.html" . }}
    </body>
</html>
