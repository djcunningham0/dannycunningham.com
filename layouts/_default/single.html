{{ define "main" }}
<article>
    <h1>{{ .Title }}</h1>
    {{ with .Params.subtitle }}
    <h2 class="subtitle">{{ . }}</h2>
    {{ end }} {{with .Date}}
    <p>
        <small><i>{{ .Format "January 2, 2006" }}</i></small>
    </p>
    {{ end }}
    <hr />
    {{ .Content }}
    <hr />
    {{ with .Params.tags }}
    <p>
        Tags: {{ range . }}
        <a href="/tags/{{ . | urlize }}">{{ . }}</a>
        {{ end }}
    </p>
    {{ end }}
</article>
{{ end }}
